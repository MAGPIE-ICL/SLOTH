[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sloth"
version = "0.1.0"
description = "Scalable Laser geometric Optics Tracer for HEDP"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "numpy",
    "scipy",
    "jax",
    "jaxlib",
    "diffrax",
    "equinox",
    "psutil",
    "matplotlib",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
